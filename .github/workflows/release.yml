# Publishes a GitHub release for every version in release/ that has no release yet: release/v<version>.md (the notes) and
# release/LiveRaid-<version>.zip (the mod archive, built and checked beforehand - the game is needed to build it, so CI does not).
# Runs when files in release/ are pushed, or by hand (Actions -> Release -> Run workflow). The tag v<version> is created on the pushed commit.
name: Release

on:
  push:
    paths:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish new versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for notes in release/v*.md; do
            tag=$(basename "$notes" .md)
            version="${tag#v}"
            zip="release/LiveRaid-${version}.zip"
            if [ ! -f "$zip" ]; then
              echo "skip $tag: no $zip"
              continue
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "skip $tag: already released"
              continue
            fi
            gh release create "$tag" "$zip" --title "LiveRaid ${version}" --notes-file "$notes" --target "$GITHUB_SHA" --latest
          done
