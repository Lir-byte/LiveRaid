# Publishes a GitHub release for every version in release/ that has no release yet: release/v<version>.md (the notes) and
# the archives release/LiveRaid-<version>.zip (single player) and release/LiveRaid-Online-<version>.zip (Project Fika), built and
# checked beforehand (the game is needed to build them, so CI does not).
# Runs when files in release/ are pushed, or by hand (Actions -> Release -> Run workflow). The tag v<version> is created on the pushed commit.
name: Release

on:
  push:
    paths:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish new versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for notes in release/v*.md; do
            tag=$(basename "$notes" .md)
            version="${tag#v}"
            files=()
            for zip in "release/LiveRaid-${version}.zip" "release/LiveRaid-Online-${version}.zip"; do
              if [ -f "$zip" ]; then files+=("$zip"); fi
            done
            if [ ${#files[@]} -eq 0 ]; then
              echo "skip $tag: no archives"
              continue
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag exists: refreshing its notes"
              gh release edit "$tag" --title "LiveRaid ${version}" --notes-file "$notes"
              continue
            fi
            gh release create "$tag" "${files[@]}" --title "LiveRaid ${version}" --notes-file "$notes" --target "$GITHUB_SHA" --latest
          done
